name: Mac check

# The macOS package (the code at the root of the repository). It has its own check, so a Windows problem never turns this one red,
# and a change that only touches packages/windows does not start it.
on:
  push:
    branches: [main]
    paths-ignore: ['packages/windows/**', '.github/workflows/check-windows.yml', '.github/workflows/release-windows.yml']
  pull_request:
    paths-ignore: ['packages/windows/**', '.github/workflows/check-windows.yml', '.github/workflows/release-windows.yml']

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6 # the version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm smoke
