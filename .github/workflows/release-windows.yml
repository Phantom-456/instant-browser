name: Release Windows

# Push a tag like win-v0.1.0 to build the Windows installer from packages/windows and publish it in GitHub Releases as a
# PRE-RELEASE, so the Mac updater never sees it. Windows is not validated yet (packages/windows/README.md). Not signed yet.
on:
  push:
    tags: ['win-v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/windows
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: packages/windows/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/windows/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build and publish (Windows, not signed yet)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm build
          pnpm exec electron-builder --win --x64 --publish always
        shell: bash
