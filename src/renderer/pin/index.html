<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
    <title>Pin</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="live" class="sr" role="status" aria-live="polite"></div>

    <!-- One gradient, used by the borders that draw themselves. -->
    <svg class="defs" width="0" height="0" aria-hidden="true">
      <defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"></linearGradient></defs>
    </svg>

    <div id="description" class="part pill" aria-hidden="true">
      <svg id="edge" class="edge" aria-hidden="true">
        <rect class="base" pathLength="1"></rect>
        <rect class="draw" pathLength="1"></rect>
      </svg>
      <span id="label"></span>
      <input id="rename" class="rename" type="text" maxlength="60" spellcheck="false" autocomplete="off" aria-label="Pin name" hidden />
      <span id="address"></span>
    </div>
    <button id="follow" class="part bubble" type="button"></button>
    <button id="offload" class="part bubble" type="button">
      <svg class="cd" viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="46" pathLength="1"></circle><circle class="left" cx="50" cy="50" r="46" pathLength="1"></circle></svg>
      <span id="offload-icon" class="glyph"></span>
    </button>
    <button id="remove" class="part bubble" type="button"></button>

    <button id="circle" class="circle" type="button">
      <span class="fill"></span>
      <svg class="cring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="base" cx="50" cy="50" r="48" pathLength="1"></circle>
        <circle class="draw" cx="50" cy="50" r="48" pathLength="1"></circle>
      </svg>
      <span id="icon" class="icon"></span>
    </button>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
