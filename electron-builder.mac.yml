# The macOS package. Shared settings are in electron-builder.yml.
extends: ./electron-builder.yml

mac:
  icon: build/icon.png
  category: public.app-category.productivity
  # Apple silicon and Intel get their own files (smaller than one file for both).
  # The zip files are what the auto-updater downloads; the dmg is what people install from.
  target:
    - { target: dmg, arch: [arm64, x64] }
    - { target: zip, arch: [arm64, x64] }
  artifactName: Talaria-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  minimumSystemVersion: "12.0"
  # Notarization is switched on by the release build (-c.mac.notarize=true) when the Apple secrets are set.
  notarize: false
  extendInfo:
    LSUIElement: true
    NSAppleEventsUsageDescription: Talaria asks Dia to open a link in the profile you choose, and (only if you turn on "List open tabs") reads the open tabs of your browsers.
    # macOS lists an app under "Default web browser" only when it also views HTML documents, as every browser does.
    CFBundleDocumentTypes:
      - CFBundleTypeName: HTML document
        CFBundleTypeRole: Viewer
        LSHandlerRank: Default
        CFBundleTypeIconSystemGenerated: 1
        LSItemContentTypes: [public.html]
      - CFBundleTypeName: XHTML document
        CFBundleTypeRole: Viewer
        LSHandlerRank: Default
        CFBundleTypeIconSystemGenerated: 1
        LSItemContentTypes: [public.xhtml]

dmg:
  title: Install Talaria
  background: build/dmg-background.png
  iconSize: 96
  window: { width: 660, height: 400 }
  contents:
    - { x: 180, y: 190, type: file }
    - { x: 480, y: 190, type: link, path: /Applications }
