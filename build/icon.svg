<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">Instant Browser — integrated winged IB, v3</title>
<desc id="desc">Transparent icon concept. Closed rounded window and aerodynamic joined winged IB transition from black below to hot red above. Blue flames rise inside the window. No background tile or arrow.</desc>
<defs>
  <linearGradient id="frame-heat" gradientUnits="userSpaceOnUse" x1="0" y1="780" x2="0" y2="244"><stop stop-color="#08070a"/><stop offset=".35" stop-color="#520614"/><stop offset=".7" stop-color="#ca0921"/><stop offset="1" stop-color="#ff2535"/></linearGradient>
  <linearGradient id="emblem-heat" gradientUnits="userSpaceOnUse" x1="0" y1="620" x2="0" y2="405"><stop stop-color="#09070b"/><stop offset=".3" stop-color="#640510"/><stop offset=".65" stop-color="#d70b20"/><stop offset="1" stop-color="#ff2939"/></linearGradient>
  <linearGradient id="flame-blue" gradientUnits="userSpaceOnUse" x1="0" y1="760" x2="0" y2="355"><stop stop-color="#075bd6"/><stop offset=".55" stop-color="#098fff"/><stop offset="1" stop-color="#92e5ff"/></linearGradient>
  <linearGradient id="core-blue" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#0868ed"/><stop offset="1" stop-color="#b1efff"/></linearGradient>
  <clipPath id="window-interior"><rect x="218" y="262" width="588" height="500" rx="40"/></clipPath>
</defs>
<!-- No exterior tile or solid interior panel: unpainted space is transparent. -->
<g id="contained-blue-flames" clip-path="url(#window-interior)">
  <path id="left-flame" fill="url(#flame-blue)" d="M221 772 C253 718 218 677 245 623 C273 568 239 541 255 491 C266 455 292 439 281 386 C321 429 307 466 292 494 C270 536 314 564 294 612 C282 641 285 659 299 676 C305 631 334 614 326 580 C359 614 344 646 331 672 C313 709 346 740 322 772 Z"/>
  <path id="left-flame-core" fill="url(#core-blue)" d="M245 772 C272 717 244 677 268 631 C294 580 267 548 278 516 C290 486 302 462 294 439 C316 481 284 512 290 547 C297 582 311 598 288 643 C268 684 300 735 279 772 Z"/>
  <path id="right-flame" fill="url(#flame-blue)" d="M803 772 C772 718 803 678 777 625 C750 569 785 542 769 492 C757 456 732 439 744 386 C704 429 718 466 732 494 C755 536 710 564 730 612 C743 641 739 659 725 676 C720 631 690 614 698 580 C665 614 680 646 693 672 C712 709 678 740 702 772 Z"/>
  <path id="right-flame-core" fill="url(#core-blue)" d="M779 772 C751 717 780 677 755 631 C729 580 757 548 745 516 C733 486 721 462 730 439 C707 481 740 512 734 547 C727 582 712 598 735 643 C756 684 724 735 745 772 Z"/>
  <path id="lower-flames" fill="url(#flame-blue)" d="M358 772 C395 735 367 707 393 674 C412 649 415 628 405 606 C446 642 425 675 415 699 C401 730 434 751 419 772 Z M475 772 C507 735 474 706 499 672 C521 642 521 623 509 600 C549 637 533 671 522 696 C508 729 545 752 528 772 Z M590 772 C623 738 593 706 618 675 C639 649 641 629 631 606 C670 642 652 675 640 701 C626 731 659 753 643 772 Z"/>
</g>
<rect id="closed-window" x="200" y="244" width="624" height="536" rx="58" fill="none" stroke="url(#frame-heat)" stroke-width="32"/>
<!-- Each wing overlaps its letter stem. Shared paint makes one continuous emblem. -->
<g id="integrated-fast-IB" fill="url(#emblem-heat)">
  <g id="forward-lean" transform="translate(95 0) skewX(-10)">
    <path id="I-with-left-wing" d="M435 415 H477 V615 H435 V569 C412 546 388 559 361 548 C335 538 315 516 304 493 C334 514 361 504 389 512 C410 518 424 527 435 541 V515 C410 487 374 497 340 477 C305 457 286 432 276 403 C308 436 342 434 376 450 C401 462 422 478 435 493 Z"/>
    <path id="letter-B" fill-rule="evenodd" d="M495 415 H551 C591 415 614 432 614 462 C614 481 605 494 588 501 C611 508 623 525 623 551 C623 593 598 615 556 615 H495 Z M535 451 V489 H550 C567 489 576 482 576 470 C576 457 567 451 550 451 Z M535 525 V579 H555 C575 579 585 570 585 552 C585 534 574 525 554 525 Z"/>
    <path id="joined-right-wing" d="M605 493 C623 471 642 459 670 449 C704 437 727 429 750 403 C740 436 721 462 687 479 C656 494 629 491 611 516 Z M612 535 C633 512 658 511 680 506 C706 501 726 499 744 484 C735 508 719 526 696 537 C671 549 644 537 618 559 Z M616 570 C635 554 650 560 670 556 C693 553 710 542 724 529 C712 553 696 568 675 575 C652 582 635 572 617 588 Z"/>
  </g>
</g>
</svg>
