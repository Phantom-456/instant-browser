# The Windows package. Shared settings are in electron-builder.yml.
# It is released on its own: tags that start with win-v (for example win-v0.3.0), always as a pre-release, so the Mac
# updater never sees them. Windows is not validated yet (see packages/windows/README.md).
extends: ./electron-builder.yml

publish:
  - provider: github
    owner: Phantom-456
    repo: instant-browser
    releaseType: prerelease
    tagNamePrefix: win-v

win:
  icon: build/icon.png
  target:
    - { target: nsis, arch: [x64] }
  artifactName: Instant-Browser-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
