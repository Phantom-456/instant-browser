<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
    <title>Instant Browser Search</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
