appId: io.github.phantom-456.instantbrowser
productName: Instant Browser
copyright: Instant Browser
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
# The licence files travel inside every build.
extraResources:
  - { from: LICENSE, to: LICENSE }
  - { from: NOTICE, to: NOTICE }
  - { from: THIRD_PARTY_NOTICES.md, to: THIRD_PARTY_NOTICES.md }
protocols:
  - name: Web address
    schemes: [http, https]

# Where updates come from. electron-updater reads the GitHub Releases of this repository.
publish:
  - provider: github
    owner: Phantom-456
    repo: instant-browser
    releaseType: release

mac:
  icon: build/icon.png
  category: public.app-category.productivity
  # Apple silicon and Intel get their own files (smaller than one file for both).
  # The zip files are what the auto-updater downloads; the dmg is what people install from.
  target:
    - { target: dmg, arch: [arm64, x64] }
    - { target: zip, arch: [arm64, x64] }
  artifactName: Instant-Browser-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  minimumSystemVersion: "12.0"
  # Notarization is switched on by the release build (-c.mac.notarize=true) when the Apple secrets are set.
  notarize: false
  extendInfo:
    LSUIElement: true
    NSAppleEventsUsageDescription: Instant Browser asks Dia to open a link in the profile you choose.
    # macOS lists an app under "Default web browser" only when it also views HTML documents, as every browser does.
    CFBundleDocumentTypes:
      - CFBundleTypeName: HTML document
        CFBundleTypeRole: Viewer
        LSHandlerRank: Default
        CFBundleTypeIconSystemGenerated: 1
        LSItemContentTypes: [public.html]
      - CFBundleTypeName: XHTML document
        CFBundleTypeRole: Viewer
        LSHandlerRank: Default
        CFBundleTypeIconSystemGenerated: 1
        LSItemContentTypes: [public.xhtml]

dmg:
  title: Install Instant Browser
  background: build/dmg-background.png
  iconSize: 96
  window: { width: 660, height: 400 }
  contents:
    - { x: 180, y: 190, type: file }
    - { x: 480, y: 190, type: link, path: /Applications }

win:
  icon: build/icon.png
  target:
    - { target: nsis, arch: [x64] }
  artifactName: Instant-Browser-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  resetAdHocDarwinSignature: true
